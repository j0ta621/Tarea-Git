name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Actualizar README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $BRANCH_NAME" >> README.md
          git add README.md
          git commit -m "docs: actualizar README con feature [$BRANCH_NAME]" || echo "Sin cambios"
          git push

  validate-dev:
    runs-on: self-hosted
    needs: update-readme
    steps:
      - name: Validar DEV_TOKEN contra LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Output "Los tokens de desarrollo coinciden correctamente."
            exit 0
          } else {
            Write-Error "Error: DEV_TOKEN no coincide con LOCAL_DEV_TOKEN."
            exit 1
          }